---
- name: Create the directory for the kubernetes_config_file
  file:
    path: "{{ kubernetes_kubeadm_kubelet_config_file_path | dirname }}"
    state: directory

- name: Deploy the config-file for kubeadm and kubelet
  template:
    src: "kubeadm-kubelet-config.j2"
    dest: "{{ kubernetes_kubeadm_kubelet_config_file_path }}"

- name: Initialize Kubernetes control plane with kubeadm init
  command: >
    kubeadm init
    --config {{ kubernetes_kubeadm_kubelet_config_file_path }}
    {{ kubernetes_kubeadm_init_extra_opts }}
  register: kubeadmin_init
  when: (not kubernetes_init_stat.stat.exists) and (kubernetes_ignore_preflight_errors is not defined)

- name: Initialize Kubernetes control plane with kubeadm init and ignore_preflight_errors
  command: >
    kubeadm init
    --config {{ kubernetes_kubeadm_kubelet_config_file_path }}
    --ignore-preflight-errors={{ kubernetes_ignore_preflight_errors }}
    {{ kubernetes_kubeadm_init_extra_opts }}
  register: kubeadmin_init
  when: (not kubernetes_init_stat.stat.exists) and (kubernetes_ignore_preflight_errors is defined)

- name: Print the init output to screen.
  debug:
    var: kubeadmin_init.stdout
    verbosity: 2
  when: not kubernetes_init_stat.stat.exists

- name: Ensure .kube directory exists.
  file:
    path: ~/.kube
    state: directory
    mode: 0755

- name: Symlink the kubectl admin.conf to ~/.kube/conf.
  file:
    src: /etc/kubernetes/admin.conf
    dest: ~/.kube/config
    state: link
    mode: 0644

- name: Configure Flannel networking.
  command: "kubectl apply -f {{ kubernetes_flannel_manifest_file }}"
  register: flannel_result
  changed_when: "'created' in flannel_result.stdout"
  when: kubernetes_pod_network.cni == 'flannel'
  until: flannel_result is not failed
  retries: 12
  delay: 5

- name: Configure Calico networking.
  command: "kubectl apply -f {{ kubernetes_calico_manifest_file }}"
  register: calico_result
  changed_when: "'created' in calico_result.stdout"
  when: kubernetes_pod_network.cni == 'calico'
  until: calico_result is not failed
  retries: 12
  delay: 5

- name: Get Kubernetes version for Weave installation.
  shell: kubectl version | base64 | tr -d '\n'
  changed_when: false
  register: kubectl_version
  when: kubernetes_pod_network.cni == 'weave'
  until: kubectl_version is not failed
  retries: 12
  delay: 5

- name: Configure Weave networking.
  command: "{{ item }}"
  with_items:
    - "kubectl apply -f https://cloud.weave.works/k8s/net?k8s-version={{ kubectl_version.stdout_lines[0] }}"
  register: weave_result
  changed_when: "'created' in weave_result.stdout"
  when: kubernetes_pod_network.cni == 'weave'

# TODO: Check if taint exists with something like `kubectl describe nodes`
# instead of using kubernetes_init_stat.stat.exists check.
- name: Allow pods on control plane (if configured).
  command: "kubectl taint nodes --all node-role.kubernetes.io/control-plane-"
  when:
    - kubernetes_allow_pods_on_control_plane | bool
    - not kubernetes_init_stat.stat.exists

- name: Upload certs
  command: kubeadm init phase upload-certs --upload-certs
  changed_when: true
  register: kubeadm_upload_certs_output
  when: kubernetes_control_plane_endpoint != ""

- name: Debug kubeadm upload certs output
  debug:
    var: kubeadm_upload_certs_output

- name: Extract certificate key
  set_fact:
    kubernetes_control_plane_certificate_key: >
      "{{ kubeadm_upload_certs_output.stdout_lines[2] | default('') }}"
  when: kubernetes_control_plane_endpoint != ""

- name: Fail if certificate key not found
  fail:
    msg: "Certificate key not found in kubeadm output"
  when: kubernetes_control_plane_endpoint != "" and kubernetes_control_plane_certificate_key == ""

- name: Get the kubeadm join command from the Kubernetes control plane.
  command: kubeadm token create --print-join-command --certificate-key "{{ kubernetes_control_plane_certificate_key }}"
  changed_when: false
  register: kubernetes_control_plane_join_command_result

- name: Set the kubeadm join control plane command globally.
  set_fact:
    kubernetes_control_plane_join_command: >
      {{ kubernetes_control_plane_join_command_result.stdout }}
      {{ kubernetes_control_plane_join_command_result_extra_opts }}
  when: (kubernetes_control_plane_join_command_result.stdout is defined) and (kubernetes_ignore_preflight_errors is not defined)
  delegate_to: "{{ item }}"
  delegate_facts: true
  with_items: "{{ groups['all'] }}"

- name: Set the kubeadm join control plane command with ignore preflight errors globally.
  set_fact:
    kubernetes_control_plane_join_command: >
      {{ kubernetes_control_plane_join_command_result.stdout }}
      --ignore-preflight-errors={{ kubernetes_ignore_preflight_errors }}
      {{ kubernetes_control_plane_join_command_result_extra_opts }}
  when: (kubernetes_control_plane_join_command_result.stdout is defined) and (kubernetes_ignore_preflight_errors is defined)
  delegate_to: "{{ item }}"
  delegate_facts: true
  with_items: "{{ groups['all'] }}"


- name: Get the kubeadm join node command from the Kubernetes control plane.
  command: kubeadm token create --print-join-command
  changed_when: false
  register: kubernetes_join_command_result

- name: Set the kubeadm join command globally.
  set_fact:
    kubernetes_join_command: >
      {{ kubernetes_join_command_result.stdout }}
      {{ kubernetes_join_command_extra_opts }}
  when: (kubernetes_join_command_result.stdout is defined) and (kubernetes_ignore_preflight_errors is not defined)
  delegate_to: "{{ item }}"
  delegate_facts: true
  with_items: "{{ groups['all'] }}"

- name: Set the kubeadm join command with ignore preflight errors globally.
  set_fact:
    kubernetes_join_command: >
      {{ kubernetes_join_command_result.stdout }}
      --ignore-preflight-errors={{ kubernetes_ignore_preflight_errors }}
      {{ kubernetes_join_command_extra_opts }}
  when: (kubernetes_join_command_result.stdout is defined) and (kubernetes_ignore_preflight_errors is defined)
  delegate_to: "{{ item }}"
  delegate_facts: true
  with_items: "{{ groups['all'] }}"
